<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%"   stop-color="#1c2444"/>
      <stop offset="100%" stop-color="#0a0d18"/>
    </radialGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5c77e"/>
      <stop offset="100%" stop-color="#d99c4a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square card -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Subtle ambient halo behind the flag -->
  <circle cx="256" cy="280" r="170" fill="#f5c77e" opacity="0.08"/>
  <!-- Stylized flag: pole on left, triangular pennant pointing right -->
  <g transform="translate(160 140)">
    <!-- Pole -->
    <rect x="0" y="0" width="14" height="240" rx="7" fill="#e9ecf6"/>
    <!-- Pennant (triangle) -->
    <path d="M14 12 L196 70 L14 128 Z" fill="url(#amberGlow)"/>
  </g>
</svg>
